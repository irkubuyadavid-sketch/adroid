name: 📱 Compiler l'APK Android

# Se déclenche :
#   1. Automatiquement à chaque push sur main
#   2. Manuellement depuis l'onglet Actions sur GitHub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Accepter les licences Android
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Installer les composants SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Générer le wrapper Gradle
        working-directory: android
        run: |
          # Installer Gradle via le wrapper officiel
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.2/bin/gradle wrapper --gradle-version 8.2

      - name: Compiler l'APK debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Recensement-Wanianga-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
